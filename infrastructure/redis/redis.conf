# ==============================================================================
# JobCatalyst AI - Production Redis Configuration
# ==============================================================================

# Server Network Settings
port 6379
bind 0.0.0.0
tcp-keepalive 300

# Security: Disable or rename highly dangerous commands to prevent administrative slips/attacks
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command KEYS "KEYS_DANGEROUS_REPLACED"
rename-command CONFIG ""
rename-command SHUTDOWN "SHUTDOWN_SECURE"

# Memory Limits & Eviction Policy (Optimized for Cache and Sessions)
maxmemory 512mb
maxmemory-policy volatile-lru
maxmemory-samples 5

# Persistence: Hybrid RDB + AOF
# Save points for snapshotting
save 900 1
save 300 10
save 60 10000

# Append Only File (AOF) for high transactional durability
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Client Management
maxclients 10000
timeout 0

# Lazy Freeing of memory
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes
