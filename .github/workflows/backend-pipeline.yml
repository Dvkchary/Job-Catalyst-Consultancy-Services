name: Backend Enterprise Pipeline

on:
  push:
    branches:
      - main
      - staging
    paths:
      - 'backend/**'
  pull_request:
    branches:
      - main
      - staging
    paths:
      - 'backend/**'

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  backend-checks:
    name: Backend CI (Lint, Test, Coverage)
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: jobcatalyst_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy pytest pytest-cov pytest-asyncio httpx
          pip install -r backend/requirements.txt || echo "Use poetry or pip install"

      - name: Run Ruff (Lint)
        run: ruff check backend/app

      - name: Run Black (Formatting Check)
        run: black --check backend/app

      - name: Run MyPy (Type Checking)
        run: mypy backend/app --ignore-missing-imports

      - name: Run Pytest & Coverage
        env:
          DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/jobcatalyst_test
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: testing
        run: |
          cd backend
          PYTHONPATH=. pytest --cov=app --cov-report=xml tests/

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
