# A generic, single-database configuration for Alembic.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path path, space-separated, to be prepended to sys.path when running alembic.
# This ensures that 'app' is discoverable when executing alembic from the project root.
prepend_syspath = .

# timezone to use when rendering the date within the migration file as well as the filename.
# string_tz = UTC

# version table name to prevent naming clashes
version_table = alembic_version

# database connection url (overridden dynamically in env.py from Pydantic config)
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/jobcatalyst

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
