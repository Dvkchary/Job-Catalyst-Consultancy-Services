# ==============================================================================
# JobCatalyst AI - Production Docker Compose Configuration (High Availability)
# ==============================================================================

version: '3.8'

services:
  # Production Relational DB (Fallback container or Cloud SQL in AWS/GCP)
  postgres_db:
    image: postgres:15-alpine
    container_name: jobcatalyst_prod_db
    restart: always
    shm_size: '1gb' # Shared memory allocation for high postgres workloads
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - db_net

  # Production Redis Cluster/Node
  redis:
    image: redis:7-alpine
    container_name: jobcatalyst_prod_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_prod_data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - cache_net

  # Production API Gateway (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobcatalyst_prod_backend
    restart: always
    environment:
      - ENVIRONMENT=production
      - PROJECT_NAME=JobCatalyst AI API
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
      - SECRET_KEY=${SECRET_KEY}
      - POSTGRES_HOST=postgres_db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LOG_LEVEL=INFO
      - LOG_JSON_FORMAT=true
    depends_on:
      postgres_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - app_net
      - db_net
      - cache_net

  # Production Queue Worker (Celery / Background processing)
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: jobcatalyst_prod_worker
    restart: always
    environment:
      - ENVIRONMENT=production
      - SECRET_KEY=${SECRET_KEY}
      - POSTGRES_HOST=postgres_db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LOG_LEVEL=INFO
      - LOG_JSON_FORMAT=true
    depends_on:
      postgres_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - app_net
      - db_net
      - cache_net

  # Production Frontend Server (Nginx Static)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobcatalyst_prod_frontend
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - app_net

  # Production Load Balancer / Ingress Reverse Proxy (Primary Gateway)
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: jobcatalyst_prod_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mount certificates as volumes
      - /etc/letsencrypt:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - app_net

networks:
  # Network segregation for zero trust backend architecture
  app_net:
    driver: bridge
  db_net:
    driver: bridge
    internal: true # Isolates DB net from public proxy/frontend
  cache_net:
    driver: bridge
    internal: true # Isolates Cache net from public proxy/frontend

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
