# Connection pooling configurations for Backend and Frontend
upstream backend_server {
    server backend:8000;
    keepalive 32;
}

upstream frontend_server {
    server frontend:3000;
    keepalive 32;
}

# HTTP: Redirect all traffic to HTTPS (Production/Staging Ready)
server {
    listen 80;
    listen [::]:80;
    server_name localhost jobcatalyst.ai www.jobcatalyst.ai;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server block
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localhost jobcatalyst.ai www.jobcatalyst.ai;

    # SSL Configuration (Paths can be mapped as Docker volumes in Production)
    # Using secure modern TLS settings (Mozilla intermediate profile)
    ssl_certificate /etc/nginx/ssl/live/jobcatalyst.ai/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/jobcatalyst.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL session parameters for performance
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' *; frame-ancestors 'none';" always;

    # Proxy headers
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    # Route Backend APIs
    location /api/ {
        proxy_pass http://backend_server;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Route Backend OpenAPI docs (only reachable if environment settings allow)
    location /docs {
        proxy_pass http://backend_server;
    }
    location /redoc {
        proxy_pass http://backend_server;
    }
    location /openapi.json {
        proxy_pass http://backend_server;
    }

    # Route Frontend Applications
    location / {
        proxy_pass http://frontend_server;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Proxying Error fallbacks
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
